<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Amritanshu’s Birthday Wishlist</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F6EDDC;--ink:#3B281E;--mute:#6E5848;--gold:#DAA840;--dark:#3B281E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--dark);font-family:ui-monospace,"Courier New",Courier,monospace;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:12px}
.card{width:100%;max-width:880px;min-height:520px;background:var(--bg);border:2px solid var(--gold);outline:1px solid var(--mute);outline-offset:-10px;position:relative;padding:44px 40px 64px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.card:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,var(--dark) 0 14px,var(--bg) 14px 22px);border-top:6px solid var(--dark)}
.tag{color:var(--gold);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
h1,h2{margin:0 0 14px}h2{font-size:26px}h1{font-size:34px}
p{line-height:1.65;font-size:15px;margin:0 0 12px}
input{font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--ink);background:#fff8ea;color:var(--ink);width:100%;max-width:360px}
button{font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;padding:12px 20px;cursor:pointer;margin-top:12px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.num{width:30px;height:30px;border-radius:50%;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-right:10px}
.split{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.split>div:first-child{flex:1 1 260px}
.pics{flex:1 1 300px;display:flex;flex-wrap:wrap;justify-content:center;gap:0}
.pics img{width:44%;min-width:130px;max-width:210px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));margin:-4px -2px}
.pics img:nth-child(odd){transform:rotate(-5deg)}.pics img:nth-child(even){transform:rotate(4deg)}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--dark);color:var(--bg);margin:-44px -40px -64px;padding:44px 40px 64px;min-height:520px}
.hero img{width:230px;max-width:60%;transform:rotate(4deg);margin:0 auto}
.dots{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute);z-index:2}
.fade{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:560px){.card{padding:32px 22px 60px}.hero{margin:-32px -22px -60px;padding:32px 22px 60px}h1{font-size:28px}}
</style></head><body><div class="card" id="c"></div>

. Needs no gift receipt.", [2, 3]], ["Plants & pots", "I will talk to them daily. They will not talk back.", [4, 5, 6]], ["A tiny pond or aquarium", "A tiny ocean for my tiny dreams.", [7, 8]], ["Letters & drawings", "Handwritten, please. Texts get deleted, letters get framed.", [9, 10]], ["Movie poster set", "My walls are looking at me. Bored.", [11, 12, 13]], ["Cat eye nail polish sets", "Tiny bottle. Big magnetic energy.", [14, 15, 16]], ["Stud earrings", "Small. Shiny. Zero tangling.", [17, 18, 19]], ["Room decor", "Making my room look like I have it together.", [20, 21, 22]], ["Lewis Hamilton goodies", "Mercedes edition preferred. Ferrari accepted with a smile.", [23, 24, 25]], ["Messi jersey or doodle", "The GOAT. On my back or on my wall.", [26, 27]], ["Flowers", "Roses or lavender. I will smell them for ten minutes.", [28, 29, 30]]],NOTES={"hem": ["Heyyo Hem!", "Long time, bhai. You’re one of my dearest buddies, one of the rarest of the rare, and I’m still on great terms with you after so long since school. I really miss you a lot, and our great hostel days too. Really looking forward to meeting you in December.", "I really appreciate the way you are, man.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Loads and loads of love. Big hug, mere bhai. 🤗"], "raj": ["Hey Raj!", "My lovely junior, though honestly you’ve been more like a pillar than a junior. You’ve always had my back and been a huge support in everything. You’re also my favorite partner for long, long discussions, and that all-nighter we pulled during Durga Puja was one of the best nights ever.", "Thank you for always being there, man.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Big hug, and lots of love. 🤗"], "om": ["Hello bhaiya!", "You’re one of the coolest, most chill seniors I know, and you’ve always stood by me and supported me in everything. I’m also a huge fan of your F1 tyre knowledge, honestly I could listen to you explain strategy all day. Being Hamilton stans together makes it even better.", "Thank you for being such a great bhaiya.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Lots of love and a big hug. 🤗", "Stay a Hamilton paglu for lifetime! 🏎️"], "prity": ["Good morning Prity,", "Thank you so much for such a lovely text. My morning is a bit late, but I really appreciate it. You’re one of those rare people around whom time never feels slow, and I’m really glad to have you as a junior and a friend.", "Also, a small apology for all the trouble I caused you during our ludo matches in the bus. 😅 I promise to play fairer next time (maybe).", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Thank you for being so lovely. Have a wonderful day! 😊"], "harsh": ["Hello sir,", "I really love the bond we share, and I’m so glad to have you in our family. You’ve always taken such good care of me, of didi, and of everyone around you, and that means a lot. Thank you for being so caring and for always being there. Didi is lucky to have you, and so are we.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Lots of love, jiju. ❤️"], "mansi": ["Hey Mansi!", "You’re my favorite junior and one of the sweetest people I know, so just stay the way you are. Bohot success paao life mein aur bohot aage badho!", "Thank you so much for the birthday card you made for me. I really loved it, and I don’t have the words to describe how special it was. 🥹", "And please never lose that pretty smile of yours. It makes everyone’s day better. 😊", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Lots of love and best wishes always!"], "shashi": ["Hey Shashi!", "You’ve always been such a sweet and respectful junior, and I really appreciate that. Your Marvel trivia is also next level. I always enjoy listening to it, and I’m always learning something new. 😄", "Fun fact: your name is the same as my favorite Sridevi character, so you automatically get bonus points from me.", "Keep smiling, keep being you, and keep dropping those trivia bombs.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Best wishes always!"], "rupal": ["Hello Rupal ji,", "I hope you’re okay with me calling you by your name. We both have so much respect for each other that we ultimately never call each other by name.", "You’ve probably been the best find of this year for me, and a great addition to my list of friends. You’re really sweet and caring, and I really adore people with such a big heart and kind manner.", "I must say, you’re one of the most beautiful people I’ve ever met. Your smile, your eyes, everything is just so, so pretty about you. This is genuine appreciation, not some cheap flirting. I know you don’t like that, lmao.", "Stay a Monkey D. Luffy paglu forever. Looking forward to more pool sessions with you in Plato. And aap bhi kabhi kabhi reels bhej diya karo, lol.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Take care, warm hug, and loads of love."], "rahul": ["Hey Rahul!", "You’re one of the sweetest and nicest guys I know, and I’m really glad we ended up as batchmates, even if we’re in different departments. 😄", "Fellow cinematard, you’re one of the few people I can talk movies with for hours without getting bored. Always up for a good film recommendation or a long argument about which one is better.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Thanks for being a great friend. Best wishes always!"], "hansika": ["Hey Hansika!", "Even though we’re from different departments, you’ve become one of my really close friends, and I’m so glad for that. 😊", "I really miss those bus rides home, sitting side by side, having the most nonsense discussions and our music sessions. Those were honestly some of the best parts of my day.", "Just know that I’m always by your side whenever you need me, for anything, anytime. And please never stay upset about anything. You deserve to smile more than you stress.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Lots of love and best wishes always!"], "samriddhi": ["Hey Samriddhi!", "You’re one of my coolest juniors, and I really love how our humor and taste match on so many things. Messi, Rohit Sharma, and all the rest. It’s rare to find someone on the same wavelength, so I’m glad I did. 😄", "Honestly, anyone who’s a Messi and Rohit fan automatically has great taste in my book.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Thanks for being such a good friend. Best wishes always!"], "siddhima": ["Hey Siddhima!", "You’re one of the coolest super juniors I know, with such great vibes, and our humor is so in sync. 😄 Please stay like this forever, because the world needs more people like you.", "Also, take good care of yourself and Priyanshu, both of you. And remember, I’m always there whenever you need me.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Thanks for being so awesome. Best wishes always!"], "ayush": ["Ayush, my better half! 😂", "Since school days, and I’ve honestly lost count of the chaos we’ve caused together. Every “almost” moment we’ve survived deserves its own movie, and nobody is allowed to watch it. 🙈", "You’re my best friend, my bestest friend, and the one person who knows way too much about me. I miss you like crazy. A proper fist my bump is pending, and it will be collected in full when we meet.", "And no, you still can’t take my underwear. Some boundaries stay forever.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like. Not that you have a choice. 😏", "Love you so much, wifey."], "animesh": ["Animesh! My coolest chotu bhai, my big hero, and my partner in chaos.", "Life with you is never boring, mostly because you make sure of it. Half my best stories exist because of your chaos, and the other half I’ve been told not to repeat. 😄 You may be my chotu bhai, but you walk in like the main hero every time. Humble, as always.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Now behave. (You won’t.) Lots of love, babu! 🤗"], "aarya": ["Hey Aarya!", "You’re to me what Deepika is to Shah Rukh, my favorite junior forever and one of the best people who matches my vibe so perfectly. 😄 Some people just click, and you’re one of them.", "I really miss those freshers prep days. We need to perform together a lot more, because that stage is incomplete without us. And we definitely need more visits like the Ormanjhi park one.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Thanks for being such an awesome friend. Best wishes always!"], "priyanshu": ["Hey Priyanshu!", "You’re my very lovely super junior, always so helpful and so respectful. May you always be this cheerful and lovable.", "Please take care of yourself and Siddhima, both of you.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Loads of love!"], "falak": ["Hey Falak!", "One of my coolest juniors, and you match my vibe and brainrot humor so much. Every moment with you is so filled.", "I really appreciate how you share your lunch with me most of the time without even asking. And one more thing: “aap meri taraf ungli na karein.” 😂", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like."], "kamil": ["Hey Kamil!", "Mr. Fresher and a really cool super junior. I really adore your dressing sense, your taste in books and movies, and your political opinions and rational beliefs are so my kind.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like."], "shreya": ["Hey Shreya!", "Thank you so much for such a lovely wish. You’re such a lovely and sweet junior, with a great Hindi vocabulary, obviously. 😄", "I miss our great ludo sessions on the bus back seat, and I really like your music taste a lot. Aunty ko dher saara pranam aur namaste.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like."], "himani": ["Hey Himani!", "My beautiful batchmate from another department, obviously. I really like your reels so much, and I do like every single one of them, I swear. Keep making reels the way you do, really appreciate it.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like."], "anubhav": ["Hey Anubhav!", "My cool super junior. I really like your humor and how classy you keep yourself, and your brainrot story spams are some different level stuff, lol.", "Just stay the way you are, really appreciate it. And don’t forget, your one super senior is always there for all your queries.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like."], "pawan": ["Hey Pawan!", "My favorite junior and one of the best buddies. It’s always great catching up with you, never a dull moment with you. Stay the way you are, man.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like."], "aaditya": ["Hello Saini bhai,", "Never met you in person, but it always feels like it would be great to meet up and do random stuff in the name of memories. Bhagwan aapke pairon ko sahi salamat rakhein.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Loads of love, warm hug, and thank you so much for your wish."], "shruti": ["Hello didi, pranam.", "First of all, I hope everything is well and good. Bhagwan aapko humesha khush rakhein.", "I miss you a lot, and I got so happy when I saw you in Ghaghra that day. What a surprise that was! Really hope to meet you soon.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Loads of love and pranam."], "shruti didi": ["Hello didi, pranam.", "First of all, I hope everything is well and good. Bhagwan aapko humesha khush rakhein.", "I miss you a lot, and I got so happy when I saw you in Ghaghra that day. What a surprise that was! Really hope to meet you soon.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Loads of love and pranam."], "om vishesh": ["Hello bhaiya!", "You’re one of the coolest, most chill seniors I know, and you’ve always stood by me and supported me in everything. I’m also a huge fan of your F1 tyre knowledge, honestly I could listen to you explain strategy all day. Being Hamilton stans together makes it even better.", "Thank you for being such a great bhaiya.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Lots of love and a big hug. 🤗", "Stay a Hamilton paglu for lifetime! 🏎️"], "saini": ["Hello Saini bhai,", "Never met you in person, but it always feels like it would be great to meet up and do random stuff in the name of memories. Bhagwan aapke pairon ko sahi salamat rakhein.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Loads of love, warm hug, and thank you so much for your wish."], "priti": ["Good morning Prity,", "Thank you so much for such a lovely text. My morning is a bit late, but I really appreciate it. You’re one of those rare people around whom time never feels slow, and I’m really glad to have you as a junior and a friend.", "Also, a small apology for all the trouble I caused you during our ludo matches in the bus. 😅 I promise to play fairer next time (maybe).", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Thank you for being so lovely. Have a wonderful day! 😊"], "harsh kumar": ["Hello sir,", "I really love the bond we share, and I’m so glad to have you in our family. You’ve always taken such good care of me, of didi, and of everyone around you, and that means a lot. Thank you for being so caring and for always being there. Didi is lucky to have you, and so are we.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like.", "Lots of love, jiju. ❤️"]},GEN=["Hey!", "Thank you so much for opening this.", "I’d really appreciate it if you’d accept my birthday treat invitation, whenever and wherever you’d like."];

function lev(a,b){var d=[],x,y;for(x=0;x<=a.length;x++){d[x]=[x]}for(y=1;y<=b.length;y++){d[0][y]=y}for(x=1;x<=a.length;x++)for(y=1;y<=b.length;y++)d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]==b[y-1]?0:1));return d[a.length][b.length]}
function find(v){var s=v.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();if(NOTES[s])return NOTES[s];var tk=s.split(" "),j,k;
 for(j=0;j<tk.length;j++)if(NOTES[tk[j]])return NOTES[tk[j]];
 for(j=0;j<tk.length;j++)if(tk[j].length>=4)for(k in NOTES)if(k.length>=4&&lev(tk[j],k)<=1)return NOTES[k];return null}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[m]})}
function nav(back,label){return '<div class="row">'+(back?'<button class="ghost" onclick="go(-1)">← Back</button>':'')+'<button onclick="go(1)">'+label+'</button></div>'}
function go(d){i=Math.max(0,Math.min(steps.length-1,i+d));show()}

 if(i>0)c.insertAdjacentHTML("beforeend",'<div class="dots">'+(i+1)+" / "+steps.length+"</div>")}
function start(){
 var v=document.getElementById("nm").value.trim();if(!v)return;
 who=v;var k=v.toLowerCase().split(/\s+/)[0];
 var n=find(v)||GEN.map(function(x,j){return j==0?"Hey "+esc(v)+"!":x});
 steps=[steps[0],function(){return '<div class="tag">A note for you</div>'+n.map(function(t,j){return j==0?"<h2>"+esc(t)+"</h2>":"<p>"+esc(t)+"</p>"}).join("")+nav(0,"Continue →")},
 function(){return '<div class="tag">Before you open the wishlist</div><h2>A tiny note from me</h2><p>Hey! First of all, thank you so, so much for opening this and showing an interest. It already means a lot to me.</p><p>If you’re reading this, you know it’s my birthday eve and tomorrow’s my birthday, so I made a little wishlist for the occasion. You absolutely do NOT need to gift me all of these, or anything at all. A casual birthday wish, an Instagram story, a little warm hug… anything would make me happy, and I’d genuinely appreciate it.</p><p>I just wanted you all to know that if you do choose any of the things listed below for me, it would make my day, my year, and everything feel so special. I’d love it so, so, so, so much, like to the galaxy and back at least ten thousand times. And I would never, ever forget it. Not in this lifetime.</p><p>Thank you for reading. Okay, now go on… and enjoy the very official wishlist.</p>'+nav(1,"Open the wishlist →")},
 function(){return '<div class="hero"><div><h1>Happy Birthday<br>Amritanshu</h1><p>A very official wishlist<br>(please read carefully)</p>'+nav(1,"Start →")+'</div><img src="'+IMG[1]+'" alt="Amritanshu"></div>'}];
 ITEMS.forEach(function(it,j){steps.push(function(){return '<div class="split"><div><span class="num">'+(j+1)+'</span><h2 style="display:inline">'+esc(it[0])+'</h2><p style="margin-top:14px">'+esc(it[1])+'</p>'+nav(1,j==ITEMS.length-1?"Finish →":"Next →")+'</div><div class="pics">'+it[2].map(function(n){return '<img src="'+IMG[n]+'" alt="">'}).join("")+'</div></div>'})});
 steps.push(function(){return '<div class="split"><div><h1>Thank you,<br>in advance</h1><p>Any one of these. All of these.<br>Hugs also accepted.</p>'+nav(1,"").replace('<button onclick="go(1)"></button>','')+'</div><div class="pics"><img src="'+IMG[31]+'" alt="" style="transform:none;max-width:260px"></div></div>'});
 i=1;show()}
steps=[function(){return '<div class="tag">Birthday wishlist</div><h1>Who’s this?</h1><p>Type your name to open your note.</p><input id="nm" placeholder="Your name" autocomplete="off" onkeydown="if(event.key===\'Enter\')start()"><br><button onclick="start()">Open →</button>'}];
